<!DOCTYPE html>
<html lang="ru">
<head>
 <link rel="icon" type="image/x-icon" href="icon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крутой Фермер · Три в ряд</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
body {
    font-family: 'Segoe UI', 'Comic Sans MS', Roboto, system-ui, sans-serif;
    background: #87ceeb;
    background-image:
        radial-gradient(circle at 15% 15%, #fff8b0 0%, transparent 22%),
        linear-gradient(180deg, #7ec8e3 0%, #a8d8ea 40%, #c8e6a0 70%, #8fbc4a 100%);
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; position: relative; overflow: hidden;
}
.sun { position: fixed; top: 30px; left: 60px; width: 110px; height: 110px;
    background: radial-gradient(circle, #fff3a0 0%, #ffd93b 55%, #ffb300 100%);
    border-radius: 50%; box-shadow: 0 0 60px #ffd93b, 0 0 120px #ffb30080;
    z-index: 0; pointer-events: none; animation: sunPulse 5s ease-in-out infinite; }
@keyframes sunPulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 60px #ffd93b, 0 0 120px #ffb30080; }
    50% { transform: scale(1.06); box-shadow: 0 0 80px #ffe76b, 0 0 160px #ffb300a0; } }
.cloud { position: fixed; background: #fff; border-radius: 100px; opacity: 0.9;
    pointer-events: none; z-index: 0; filter: drop-shadow(0 6px 12px rgba(120,150,180,0.25)); }
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.cloud1 { top: 70px; left: -180px; width: 160px; height: 55px; animation: cloudFloat1 45s linear infinite; }
.cloud1::before { width: 80px; height: 80px; top: -35px; left: 20px; }
.cloud1::after  { width: 60px; height: 60px; top: -25px; left: 75px; }
.cloud2 { top: 150px; left: -220px; width: 130px; height: 45px; animation: cloudFloat2 60s linear infinite; animation-delay: -20s; opacity: 0.75; }
.cloud2::before { width: 65px; height: 65px; top: -30px; left: 15px; }
.cloud2::after  { width: 50px; height: 50px; top: -20px; left: 60px; }
.cloud3 { top: 40px; left: -250px; width: 190px; height: 60px; animation: cloudFloat3 75s linear infinite; animation-delay: -40s; opacity: 0.65; }
.cloud3::before { width: 95px; height: 95px; top: -45px; left: 25px; }
.cloud3::after  { width: 70px; height: 70px; top: -30px; left: 95px; }
@keyframes cloudFloat1 { from { transform: translateX(0); } to { transform: translateX(120vw); } }
@keyframes cloudFloat2 { from { transform: translateX(0); } to { transform: translateX(130vw); } }
@keyframes cloudFloat3 { from { transform: translateX(0); } to { transform: translateX(140vw); } }
.hills { position: fixed; bottom: 0; left: 0; width: 100%; height: 38vh; z-index: 0; pointer-events: none;
    background:
        radial-gradient(ellipse 60% 100% at 20% 100%, #7cb342 0%, transparent 70%),
        radial-gradient(ellipse 50% 90% at 75% 100%, #8bc34a 0%, transparent 70%),
        linear-gradient(180deg, transparent 0%, #8fbc4a 60%, #6b9a35 100%); }
.fence-bg { position: fixed; bottom: 28vh; left: 0; width: 100%; height: 60px; z-index: 0; pointer-events: none; opacity: 0.55;
    background-image: repeating-linear-gradient(90deg, #8b5a2b 0px, #8b5a2b 8px, transparent 8px, transparent 34px);
    background-size: 34px 100%; border-top: 4px solid #6b4423; border-bottom: 4px solid #6b4423; }

.game-container { position: relative; z-index: 5; width: 100vw; height: 100vh;
    display: grid; grid-template-rows: auto 1fr; padding: 0; overflow: hidden; }
.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px;
    background: repeating-linear-gradient(90deg, #8b5a2b 0px, #9c6a35 6px, #7a4e24 6px, #7a4e24 12px);
    border-bottom: 6px solid #4d2f14;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 -3px 0 #5a3a1a, inset 0 3px 0 #b8804a;
    flex-shrink: 0; position: relative; }
.top-bar::before, .top-bar::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%);
    width: 8px; height: 26px; background: radial-gradient(circle, #3a2510 0%, #5a3a1a 70%);
    border-radius: 50%; box-shadow: inset 0 1px 2px #00000080; }
.top-bar::before { left: 14px; } .top-bar::after { right: 14px; }
.title { font-size: 2.1rem; font-weight: 900; color: #fff3c4;
    text-shadow: 3px 3px 0 #4d2f14, 0 0 18px #ffb30060; letter-spacing: 2px; transform: rotate(-1deg);
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; white-space: nowrap; }
.money-box { background: linear-gradient(180deg, #f5deb3, #d9b878); border-radius: 14px;
    padding: 10px 22px; border: 4px solid #6b4423;
    box-shadow: inset 0 -4px 0 #a88653, inset 0 3px 0 #fff3d0, 0 5px 0 #3a2510, 0 8px 14px rgba(0,0,0,0.3);
    font-weight: 900; font-size: 1.7rem; color: #3a2510; display: flex; align-items: center; gap: 10px;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; position: relative; }
.money-box::after { content: ''; position: absolute; inset: 4px; border-radius: 10px;
    border: 1px dashed #8b5a2b60; pointer-events: none; }
.money-box svg { width: 36px; height: 36px; }

.main-area { display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 24px; padding: 18px 24px 22px; overflow: hidden; min-height: 0; }
.board-wrapper { position: relative; flex-shrink: 0; height: 100%; aspect-ratio: 1 / 1;
    max-width: 88vh; max-height: 88vh; }
.board-wrapper::before { content: ''; position: absolute; inset: -14px;
    background: repeating-linear-gradient(90deg, #5a3a1a 0px, #5a3a1a 4px, #4a2e12 4px, #4a2e12 8px);
    border-radius: 32px; z-index: -1; box-shadow: 0 10px 24px rgba(0,0,0,0.45); }
.board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
    background: radial-gradient(circle at 50% 0%, #6b4e2e 0%, #4a3520 100%);
    padding: 14px 12px; border-radius: 26px;
    box-shadow: inset 0 0 0 5px #3a2510, inset 0 0 30px #1e1308, 0 8px 0 #2a1a08;
    width: 100%; height: 100%; touch-action: none; position: relative; }
.board::before, .board::after { content: ''; position: absolute; width: 22px; height: 22px;
    background: radial-gradient(circle, #8b5a2b 0%, #5a3a1a 80%); border-radius: 50%;
    box-shadow: inset 0 2px 4px #00000080, 0 2px 4px rgba(0,0,0,0.5); }
.board::before { top: 6px; left: 6px; } .board::after { top: 6px; right: 6px; }

.cell { aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 30% 25%, #fdf5d8 0%, #ecd8a8 55%, #c9a76a 100%);
    border-radius: 12px;
    box-shadow: inset 0 -4px 0 #a88653, inset 0 3px 0 #fff8d8, 0 4px 6px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center; position: relative;
    cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; will-change: transform;
    border: 2px solid #b59462; overflow: hidden; }
.cell::after { content: ''; position: absolute; bottom: 3px; left: 4px; width: 5px; height: 5px;
    background: #7cb342; border-radius: 50% 0 50% 0;
    box-shadow: 6px 2px 0 #8bc34a, -2px 4px 0 #6b9a35; opacity: 0.55; pointer-events: none; }
.cell.selected { box-shadow: 0 0 0 4px #ffee88, inset 0 -4px 0 #a88653, inset 0 3px 0 #fff8d8, 0 0 24px #ffd966;
    transform: scale(0.94); z-index: 5; }
.cell.dragging { box-shadow: 0 0 0 4px #a8e6ff, inset 0 -4px 0 #a88653, inset 0 3px 0 #fff8d8, 0 0 24px #7fd3ff;
    transform: scale(1.06); z-index: 10; }
.cell svg { width: 88%; height: 88%; display: block; pointer-events: none;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3)); }

.cell.empty { background: repeating-linear-gradient(45deg, #d8c8a8 0px, #d8c8a8 6px, #c8b898 6px, #c8b898 12px);
    box-shadow: inset 0 0 0 3px #a08050, inset 0 0 20px #00000030; cursor: pointer; }
.cell.empty::after { display: none; }
.cell.empty .build-sign { width: 60%; height: 44%;
    background: repeating-linear-gradient(90deg, #b07840 0px, #b07840 6px, #96632f 6px, #96632f 9px);
    border: 3px solid #6b4423; border-radius: 6px;
    box-shadow: inset 0 -3px 0 #5a3a1a, inset 0 2px 0 #d8a868, 0 3px 4px rgba(0,0,0,0.35);
    position: relative; }
.cell.empty .build-sign::before, .cell.empty .build-sign::after {
    content: ''; position: absolute; top: 50%; width: 5px; height: 5px;
    background: radial-gradient(circle, #3a2510 0%, #5a3a1a 80%); border-radius: 50%;
    transform: translateY(-50%); box-shadow: inset 0 1px 1px #000; }
.cell.empty .build-sign::before { left: 4px; } .cell.empty .build-sign::after { right: 4px; }

.cell.building { background: linear-gradient(180deg, #e8d8b8 0%, #c8a870 100%);
    box-shadow: inset 0 -4px 0 #8a6a40, inset 0 3px 0 #fff8d8, 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
.cell.building::after { display: none; }
.cell.building svg { width: 92%; height: 92%; animation: none !important; transform-origin: center; }

.cell.construction {
    background: repeating-linear-gradient(45deg, #e0d0a8 0px, #e0d0a8 5px, #d0b888 5px, #d0b888 10px);
    cursor: default; }
.cell.construction::after { display: none; }
.cell.construction .construction-icon {
    font-size: 1.6rem; line-height: 1; transform: translateY(-6px);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.3)); }
.cell.construction .construction-label {
    position: absolute; bottom: 2px; font-size: 0.55rem; font-weight: 900; color: #5a3a1a;
    text-shadow: 0 1px 0 #fff8d8; letter-spacing: 0.5px; }

.cell.demolishing {
    background: repeating-linear-gradient(45deg, #e8b0a0 0px, #e8b0a0 5px, #d09080 5px, #d09080 10px);
    cursor: default; }
.cell.demolishing::after { display: none; }
.cell.demolishing .demolition-icon {
    font-size: 1.6rem; line-height: 1; transform: translateY(-6px);
    filter: drop-shadow(0 2px 1px rgba(0,0,0,0.3)); }
.cell.demolishing .demolition-label {
    position: absolute; bottom: 2px; font-size: 0.55rem; font-weight: 900; color: #6a1a1a;
    text-shadow: 0 1px 0 #ffe8e0; letter-spacing: 0.5px; }

.cell-progress {
    position: absolute; left: 4px; right: 4px; bottom: 4px; height: 6px;
    background: #00000040; border-radius: 3px; overflow: hidden;
    box-shadow: inset 0 1px 2px #00000060; pointer-events: none; z-index: 3; }
.cell-progress .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd966 0%, #7cb342 100%);
    border-radius: 3px; transition: width 0.1s linear;
    box-shadow: 0 0 6px #ffd96680; }
.cell.building.working .cell-progress .fill {
    background: linear-gradient(90deg, #6ec6ff 0%, #3a7ab0 100%);
    box-shadow: 0 0 8px #6ec6ff90; }
.cell.demolishing .cell-progress .fill {
    background: linear-gradient(90deg, #ff8a65 0%, #c62828 100%);
    box-shadow: 0 0 8px #ff8a6590; }

@keyframes animalIdle {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25%      { transform: translateY(-2px) rotate(-2deg) scale(1.02); }
    50%      { transform: translateY(0) rotate(0deg) scale(1); }
    75%      { transform: translateY(-1px) rotate(2deg) scale(1.01); } }
@keyframes animalPop {
    0%   { transform: scale(0.2) rotate(-25deg); opacity: 0; }
    60%  { transform: scale(1.12) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; } }
@keyframes cellDrop {
    0%   { transform: translateY(-60%) scale(0.9); opacity: 0.2; }
    70%  { transform: translateY(6%) scale(1.03); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; } }
@keyframes cellClear {
    0%   { transform: scale(1); opacity: 1; }
    40%  { transform: scale(1.18) rotate(8deg); opacity: 1; }
    100% { transform: scale(0.1) rotate(-30deg); opacity: 0; } }

.cell svg { transform-origin: 50% 70%; animation: animalIdle 3.2s ease-in-out infinite; will-change: transform; }
.cell:nth-child(6n+1) svg { animation-delay: 0s; }
.cell:nth-child(6n+2) svg { animation-delay: 0.25s; }
.cell:nth-child(6n+3) svg { animation-delay: 0.5s; }
.cell:nth-child(6n+4) svg { animation-delay: 0.75s; }
.cell:nth-child(6n+5) svg { animation-delay: 1s; }
.cell:nth-child(6n+6) svg { animation-delay: 1.25s; }
.cell.spawn svg { animation: animalPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both,
                           animalIdle 3.2s ease-in-out 0.32s infinite; }
.cell.drop svg { animation: cellDrop 0.28s cubic-bezier(0.22, 1, 0.36, 1) both,
                          animalIdle 3.2s ease-in-out 0.28s infinite; }
.cell.clearing svg { animation: cellClear 0.22s ease-in forwards; }
.cell.selected svg, .cell.dragging svg { animation-play-state: paused; }

@media (prefers-reduced-motion: reduce) {
    .cell svg, .cell.spawn svg, .cell.drop svg, .cell.clearing svg { animation: none !important; } }
body.low-end .cell svg { animation: none; }
body.low-end .cell.spawn svg { animation: animalPop 0.3s both; }
body.low-end .cell.drop svg  { animation: cellDrop 0.25s both; }
body.low-end .cell.clearing svg { animation: cellClear 0.2s both; }

.side-panel { display: flex; flex-direction: column; gap: 16px; width: 340px; height: 100%;
    max-height: 88vh; flex-shrink: 0; }
.goal-panel { background: linear-gradient(180deg, #f5deb3 0%, #d9b878 100%); border-radius: 14px;
    padding: 12px 16px; border: 4px solid #6b4423;
    box-shadow: inset 0 -4px 0 #a88653, inset 0 3px 0 #fff3d0, 0 5px 0 #3a2510, 0 8px 14px rgba(0,0,0,0.3);
    flex-shrink: 0; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }
.goal-title { font-size: 1.1rem; font-weight: 900; color: #3a2510; margin-bottom: 6px; text-shadow: 1px 1px 0 #fff8d8; }
.goal-list { display: flex; flex-direction: column; gap: 4px; }
.goal-item { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 800; color: #3a2510; }
.goal-item.done { color: #2a7a20; text-decoration: line-through; opacity: 0.8; }
.goal-item svg { width: 28px; height: 28px; flex-shrink: 0; }
.goal-progress { margin-left: auto; font-size: 0.95rem; }

.inventory-panel { background: repeating-linear-gradient(180deg, #b07840 0px, #b07840 22px, #96632f 22px, #96632f 26px);
    border-radius: 20px; padding: 18px 16px 20px;
    box-shadow: inset 0 0 0 4px #6b4423, inset 0 0 40px rgba(0,0,0,0.35), 0 8px 0 #3a2510, 0 14px 24px rgba(0,0,0,0.4);
    flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative; }
.inventory-panel::before { content: ''; position: absolute; top: -14px; left: -8px; right: -8px; height: 22px;
    background: linear-gradient(180deg, #8b1e1e 0%, #6b1414 100%);
    clip-path: polygon(0% 100%, 50% 0%, 100% 100%); border-radius: 6px 6px 0 0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
.inventory-title { color: #fff8d8; font-weight: 900; font-size: 1.35rem; margin: 8px 0 12px 6px;
    text-shadow: 2px 2px 0 #3a2510, 0 0 10px #ffb30040; flex-shrink: 0;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; letter-spacing: 1px; }
.inventory-grid { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px;
    flex: 1; min-height: 0; }
.inventory-grid::-webkit-scrollbar { width: 8px; }
.inventory-grid::-webkit-scrollbar-track { background: #5a3a1a; border-radius: 4px; }
.inventory-grid::-webkit-scrollbar-thumb { background: #c9a76a; border-radius: 4px; border: 1px solid #8b5a2b; }

.inv-item { background: linear-gradient(180deg, #f5deb3 0%, #e0c088 60%, #c9a76a 100%);
    border-radius: 12px; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 10px;
    box-shadow: inset 0 3px 0 #fff3d0, inset 0 -4px 0 #a88653, 0 5px 0 #6b4423, 0 8px 12px rgba(0,0,0,0.3);
    font-weight: 800; color: #3a2510; font-size: 1.05rem; border: 2px solid #8b5a2b;
    flex-shrink: 0; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; position: relative; }
.inv-item::before { content: ''; position: absolute; top: 4px; left: 6px; right: 6px; height: 2px;
    background: repeating-linear-gradient(90deg, #8b5a2b40 0 4px, transparent 4px 8px); border-radius: 2px; }
.inv-item svg { width: 36px; height: 36px; flex-shrink: 0; filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.25)); }
.inv-item span { min-width: 22px; text-align: center; font-size: 1.15rem; }
.inv-item button { border: none; border-radius: 10px; padding: 7px 12px; font-weight: 900; font-size: 0.95rem;
    color: #3a2510; cursor: pointer; transition: 0.08s; touch-action: manipulation; font-family: inherit; }
.inv-item button:hover { filter: brightness(1.1); transform: translateY(-1px); }
.inv-item button:active { transform: translateY(3px); box-shadow: none; }
.inv-item button.sell { background: linear-gradient(180deg, #ffd966, #e6b800);
    box-shadow: inset 0 2px 0 #fff3a0, 0 3px 0 #8b6b00; border: 1px solid #b38b00; }
.inv-item button.trade { background: linear-gradient(180deg, #b6e3a8, #7cb342);
    box-shadow: inset 0 2px 0 #d8f5c8, 0 3px 0 #4a7a20; border: 1px solid #5a8a2a; }

.log { background: linear-gradient(180deg, #d9b878 0%, #b08850 100%); border-radius: 14px; color: #3a2510;
    font-size: 1rem; font-weight: 800; text-align: center; padding: 14px 18px;
    box-shadow: inset 0 3px 0 #fff3d0, inset 0 -4px 0 #8b5a2b, 0 5px 0 #3a2510, 0 8px 14px rgba(0,0,0,0.3);
    border: 3px solid #6b4423; flex-shrink: 0; min-height: 62px; display: flex; align-items: center;
    justify-content: center; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; line-height: 1.25; position: relative; }
.log::before, .log::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; background: radial-gradient(circle, #3a2510, #5a3a1a); border-radius: 50%;
    box-shadow: inset 0 1px 1px #000; }
.log::before { left: 6px; } .log::after { right: 6px; }

.fly-resource { position: fixed; pointer-events: none; z-index: 999; width: 48px; height: 48px;
    transition: left 0.75s cubic-bezier(0.4, 0.0, 0.6, 1), top 0.75s cubic-bezier(0.4, 0.0, 0.6, 1),
                transform 0.75s ease-in, opacity 0.75s ease-in;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5)); }

/* ====== МОДАЛЬНАЯ ПАНЕЛЬ ВЫБОРА ЗДАНИЯ ====== */
.build-menu-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 2000; display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.18s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.build-menu {
    background: linear-gradient(180deg, #f5deb3 0%, #d9b878 100%);
    border: 5px solid #6b4423; border-radius: 20px;
    padding: 18px 18px 16px; min-width: 340px; max-width: 90vw; max-height: 86vh;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: inset 0 -6px 0 #a88653, inset 0 4px 0 #fff3d0, 0 12px 0 #3a2510, 0 20px 40px rgba(0,0,0,0.5);
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden; }
@keyframes popIn {
    0%   { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; } }
.build-menu h3 {
    margin: 0 0 4px 0; color: #3a2510; font-size: 1.25rem; font-weight: 900;
    text-shadow: 1px 1px 0 #fff8d8; text-align: center; }
.build-menu-list {
    display: flex; flex-direction: column; gap: 10px;
    overflow-y: auto; padding-right: 4px; }
.build-menu-list::-webkit-scrollbar { width: 8px; }
.build-menu-list::-webkit-scrollbar-track { background: #a08050; border-radius: 4px; }
.build-menu-list::-webkit-scrollbar-thumb { background: #6b4423; border-radius: 4px; }

.build-option {
    background: linear-gradient(180deg, #fff3d0 0%, #e0c088 100%);
    border: 3px solid #8b5a2b; border-radius: 14px;
    padding: 8px 12px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: 0.1s; position: relative;
    box-shadow: inset 0 3px 0 #fff8e0, inset 0 -4px 0 #a88653, 0 4px 0 #6b4423; }
.build-option:hover { filter: brightness(1.06); transform: translateY(-1px); }
.build-option:active { transform: translateY(3px); box-shadow: inset 0 3px 0 #fff8e0, inset 0 -4px 0 #a88653; }
.build-option.disabled {
    opacity: 0.55; cursor: not-allowed; filter: grayscale(0.6); }
.build-option.disabled:hover { filter: grayscale(0.6); transform: none; }
.build-option.disabled:active { transform: none; }

.build-option .bo-svg { width: 52px; height: 52px; flex-shrink: 0;
    filter: drop-shadow(1px 3px 2px rgba(0,0,0,0.3)); }
.build-option .bo-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.build-option .bo-name { font-size: 1.05rem; font-weight: 900; color: #3a2510; }

// ======================== ИНИЦИАЛИЗАЦИЯ ========================
function initBoardForLevel() {
    const emptyChance = level >= 1 ? 0.12 + (level - 1) * 0.04 : 0;
    board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
    buildings = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));

    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            if (level >= 1 && Math.random() < emptyChance) {
                board[r][c] = null;
            } else {
                board[r][c] = ANIMAL_KEYS[Math.floor(Math.random() * ANIMAL_KEYS.length)];
            }
        }
    }

    let attempts = 0;
    while (findAllMatches().length > 0 && attempts < 50) {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] !== null) {
                    board[r][c] = ANIMAL_KEYS[Math.floor(Math.random() * ANIMAL_KEYS.length)];
                }
            }
        }
        attempts++;
    }
}

// ======================== ПОИСК СОВПАДЕНИЙ ========================
function findAllMatches() {
    const matches = new Set();
    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE - 2; c++) {
            const v = board[r][c];
            if (!v) continue;
            if (board[r][c+1] === v && board[r][c+2] === v) {
                let k = c;
                while (k < BOARD_SIZE && board[r][k] === v) { matches.add(`${r},${k}`); k++; }
            }
        }
    }
    for (let c = 0; c < BOARD_SIZE; c++) {
        for (let r = 0; r < BOARD_SIZE - 2; r++) {
            const v = board[r][c];
            if (!v) continue;
            if (board[r+1][c] === v && board[r+2][c] === v) {
                let k = r;
                while (k < BOARD_SIZE && board[k][c] === v) { matches.add(`${k},${c}`); k++; }
            }
        }
    }
    return Array.from(matches).map(s => s.split(',').map(Number));
}

function updateSelectionUI(prevRow, prevCol, newRow, newCol) {
    const boardEl = document.getElementById('board');
    // Снять выделение со старой ячейки
    if (prevRow !== -1 && prevCol !== -1) {
        const prev = boardEl.querySelector(`.cell[data-row="${prevRow}"][data-col="${prevCol}"]`);
        if (prev) prev.classList.remove('selected');
    }
    // Поставить выделение на новую
    if (newRow !== -1 && newCol !== -1) {
        const next = boardEl.querySelector(`.cell[data-row="${newRow}"][data-col="${newCol}"]`);
        if (next) next.classList.add('selected');
    }
}

// ======================== ОТРИСОВКА ========================
function renderBoard(animState = null) {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    const now = Date.now();

    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = r;
            cell.dataset.col = c;

            const building = buildings[r][c];
            const animal = board[r][c];

            if (building) {
                if (building.state === 'constructing') {
                    cell.classList.add('construction');
                    const elapsed = now - building.startTime;
                    const progress = Math.min(1, elapsed / building.duration);
                    cell.innerHTML = `
                        <div class="construction-icon">🏗️</div>
                        <div class="construction-label">СТРОЙКА</div>
                        <div class="cell-progress"><div class="fill" style="width:${progress*100}%"></div></div>
                    `;
                } else if (building.state === 'demolishing') {
                    cell.classList.add('demolishing');
                    const elapsed = now - building.demolishStart;
                    const progress = Math.min(1, elapsed / building.demolishDuration);
                    cell.innerHTML = `
                        <div class="demolition-icon">💥</div>
                        <div class="demolition-label">СНОС</div>
                        <div class="cell-progress"><div class="fill" style="width:${progress*100}%"></div></div>
                    `;
                } else {
                    cell.classList.add('building');
                    if (building.state === 'working') cell.classList.add('working');
                    cell.innerHTML = buildingSVG(building.type, 56);
                    if (building.state === 'working') {
                        const elapsed = now - building.productionStart;
                        const progress = Math.min(1, elapsed / building.productionDuration);
                        cell.innerHTML += `<div class="cell-progress"><div class="fill" style="width:${progress*100}%"></div></div>`;
                    }
                    cell.title = building.state === 'working'
                        ? `${BUILDINGS[building.type].name}: производит...`
                        : `${BUILDINGS[building.type].name}: ЛКМ — переработать, ПКМ — снести`;
                }
            } else if (animal) {
                if (selectedRow === r && selectedCol === c) cell.classList.add('selected');
                if (dragActive && dragStartRow === r && dragStartCol === c) cell.classList.add('dragging');
                cell.innerHTML = animalSVG(animal, 56);
                if (animState) {
                    if (animState.clearing && animState.clearing.has(`${r},${c}`)) cell.classList.add('clearing');
                    if (animState.spawn && animState.spawn.has(`${r},${c}`)) cell.classList.add('spawn');
                    if (animState.drop && animState.drop.has(`${r},${c}`)) cell.classList.add('drop');
                }
            } else {
                cell.classList.add('empty');
                cell.innerHTML = `<div class="build-sign"></div>`;
                cell.title = 'Пустое место для здания (ЛКМ — построить)';
            }
            boardEl.appendChild(cell);
        }
    }
}

function updateProgressBars() {
    const boardEl = document.getElementById('board');
    const now = Date.now();
    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            const building = buildings[r][c];
            if (!building) continue;
            const cellEl = boardEl.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
            if (!cellEl) continue;
            const fill = cellEl.querySelector('.cell-progress .fill');
            if (!fill) continue;

            if (building.state === 'constructing') {
                const elapsed = now - building.startTime;
                const progress = Math.min(1, elapsed / building.duration);
                fill.style.width = (progress * 100) + '%';
            } else if (building.state === 'working') {
                const elapsed = now - building.productionStart;
                const progress = Math.min(1, elapsed / building.productionDuration);
                fill.style.width = (progress * 100) + '%';
            } else if (building.state === 'demolishing') {
                const elapsed = now - building.demolishStart;
                const progress = Math.min(1, elapsed / building.demolishDuration);
                fill.style.width = (progress * 100) + '%';
            }
        }
    }
}

function renderGoals() {
    const goalList = document.getElementById('goalList');
    const goalTitle = document.getElementById('goalTitle');
    goalTitle.textContent = `🎯 Уровень ${level + 1}`;
    goalList.innerHTML = '';
    const goals = LEVELS[level].goals;
    Object.keys(goals).forEach(key => {
        const need = goals[key];
        const have = levelCollected[key] || 0;
        const done = have >= need;
        const div = document.createElement('div');
        div.className = 'goal-item' + (done ? ' done' : '');
        let svg = '', name = '';
        if (RESOURCES[key]) { svg = resourceSVG(key, 28); name = RESOURCES[key].name; }
        else if (PRODUCTS[key]) { svg = resourceSVG(key, 28); name = PRODUCTS[key].name; }
        else if (ANIMALS[key]) { svg = animalSVG(key, 28); name = ANIMALS[key].name; }
        div.innerHTML = `${svg} <span>${name}</span> <span class="goal-progress">${have}/${need}</span>`;
        goalList.appendChild(div);
    });
}

function checkGoals() {
    const goals = LEVELS[level].goals;
    let allDone = true;
    Object.keys(goals).forEach(key => { if ((levelCollected[key] || 0) < goals[key]) allDone = false; });
    if (allDone && !goalCompleted) {
        goalCompleted = true;
        if (level < LEVELS.length - 1) {
            log(`🎉 Уровень ${level + 1} пройден! Переход на уровень ${level + 2}...`);
            setTimeout(() => {
                activeTimers.forEach(t => clearTimeout(t));
                activeTimers.clear();
                level++;
                levelCollected = {};
                goalCompleted = false;
                // Обнуляем деньги и амбар на новом уровне
                money = 100;
                resetInventory();
                initBoardForLevel();
                renderBoard();
                renderInventory();
                updateMoneyDisplay();
                renderGoals();
                log(`🌟 Уровень ${level + 1}! Деньги и амбар обнулены. Строй заново!`);
            }, 1200);
        } else {
            log('🏆 Победа! Все 10 уровней пройдены!');
        }
    }
}

    inventory = {

// ======================== УПРАВЛЕНИЕ ========================
function getCellFromPoint(x, y) {
    const boardEl = document.getElementById('board');
    const rect = boardEl.getBoundingClientRect();
    if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) return null;
    const cellW = rect.width / BOARD_SIZE;
    const cellH = rect.height / BOARD_SIZE;
    const col = Math.floor((x - rect.left) / cellW);
    const row = Math.floor((y - rect.top) / cellH);
    if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return null;
    return { row, col };
}

function onPointerDown(e) {
    if (busy) return;
    if (e.pointerType === 'mouse' && e.button === 2) {
        const point = e;
        const cell = getCellFromPoint(point.clientX, point.clientY);
        if (cell && buildings[cell.row][cell.col]) {
            startDemolish(cell.row, cell.col);
        }
        return;
    }
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    const point = e.touches ? e.touches[0] : e;
    const cell = getCellFromPoint(point.clientX, point.clientY);
    if (!cell) return;
    const r = cell.row, c = cell.col;

    if (buildings[r][c]) {
        processBuilding(r, c, point.clientX, point.clientY);
        return;
    }
    if (!board[r][c]) {
        openBuildMenu(r, c);
        return;
    }

    dragStartRow = r; dragStartCol = c;
    dragStartX = point.clientX; dragStartY = point.clientY;
    dragActive = false;
    dragPointerId = e.pointerId !== undefined ? e.pointerId : null;
    if (selectedRow === dragStartRow && selectedCol === dragStartCol) {
        const pr = selectedRow, pc = selectedCol;
        selectedRow = -1; selectedCol = -1;
        updateSelectionUI(pr, pc, -1, -1);     // было renderBoard()
        return;
    }
}
function onPointerMove(e) {
    if (busy || dragStartRow === -1) return;
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - dragStartX;
    const dy = point.clientY - dragStartY;
    if (!dragActive && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
        dragActive = true;
        const pr = selectedRow, pc = selectedCol;
        selectedRow = dragStartRow; selectedCol = dragStartCol;
        updateSelectionUI(pr, pc, selectedRow, selectedCol);  // было renderBoard()
        // добавить класс dragging на текущую ячейку
        const el = document.querySelector(`.cell[data-row="${dragStartRow}"][data-col="${dragStartCol}"]`);
        if (el) el.classList.add('dragging');
        if (e.pointerId !== undefined && e.target.setPointerCapture) {
            try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
        }
    }
}

function onPointerUp(e) {
    if (busy) { resetDrag(); return; }
    if (dragStartRow === -1) return;

    const point = e.changedTouches ? e.changedTouches[0] : e;
    const endCell = getCellFromPoint(point.clientX, point.clientY);
    const startRow = dragStartRow, startCol = dragStartCol;
    const wasActive = dragActive;

    // Снимаем dragging-класс со стартовой ячейки, сбрасываем переменные drag
    resetDrag();

    // Не было свайпа — это обычный тап
    if (!wasActive) { handleTap(startRow, startCol); return; }

    // Свайп вышел за пределы поля
    if (!endCell) {
        const pr = selectedRow, pc = selectedCol;
        selectedRow = -1; selectedCol = -1;
        updateSelectionUI(pr, pc, -1, -1);
        return;
    }

    // Свайп вернулся в ту же ячейку — считаем как тап
    if (endCell.row === startRow && endCell.col === startCol) {
        handleTap(startRow, startCol);
        return;
    }

    const dr = Math.abs(endCell.row - startRow);
    const dc = Math.abs(endCell.col - startCol);

    // Свайп на соседнюю ячейку — меняем местами
    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        const pr = selectedRow, pc = selectedCol;
        selectedRow = -1; selectedCol = -1;
        updateSelectionUI(pr, pc, -1, -1);
        swapCells(startRow, startCol, endCell.row, endCell.col);
    } else {
        // Свайп слишком далеко — просто снимаем выделение
        const pr = selectedRow, pc = selectedCol;
        selectedRow = -1; selectedCol = -1;
        updateSelectionUI(pr, pc, -1, -1);
    }
}
function resetDrag() {
    const boardEl = document.getElementById('board');
    // Снять dragging со всех ячеек
    boardEl.querySelectorAll('.cell.dragging').forEach(el => el.classList.remove('dragging'));
    // Снять selected
    boardEl.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
    dragStartRow = -1; dragStartCol = -1; dragActive = false; dragPointerId = null;
    // renderBoard() убрать!
}
function handleTap(row, col) {
    if (!board[row][col]) return;
    if (selectedRow === -1) {
        const pr = selectedRow, pc = selectedCol;
        selectedRow = row; selectedCol = col;
        updateSelectionUI(pr, pc, row, col);   // было renderBoard()
        return;
    }
    if (selectedRow === row && selectedCol === col) {
        const pr = selectedRow, pc = selectedCol;
        selectedRow = -1; selectedCol = -1;
        updateSelectionUI(pr, pc, -1, -1);     // было renderBoard()
        return;
    }
    const dr = Math.abs(selectedRow - row), dc = Math.abs(selectedCol - col);
    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        const r1 = selectedRow, c1 = selectedCol;
        selectedRow = -1; selectedCol = -1;
        updateSelectionUI(r1, c1, -1, -1);     // было renderBoard()
        swapCells(r1, c1, row, col);
    } else {
        const pr = selectedRow, pc = selectedCol;
        selectedRow = row; selectedCol = col;
        updateSelectionUI(pr, pc, row, col);   // было renderBoard()
    }
}
function bindControls() {
    const boardEl = document.getElementById('board');
    if (window.PointerEvent) {
        boardEl.addEventListener('pointerdown', onPointerDown);
        boardEl.addEventListener('pointermove', onPointerMove);
        boardEl.addEventListener('pointerup', onPointerUp);
        boardEl.addEventListener('pointercancel', () => resetDrag());
        // Отключаем контекстное меню на поле, чтобы ПКМ работал как снос
        boardEl.addEventListener('contextmenu', (e) => e.preventDefault());
    } else {
        boardEl.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
        boardEl.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
        boardEl.addEventListener('touchend', (e) => { onPointerUp(e); });
        boardEl.addEventListener('mousedown', onPointerDown);
        boardEl.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
    }
}

            };
        }
        list.appendChild(option);
    });

    menu.appendChild(list);

    const closeBtn = document.createElement('button');
    closeBtn.className = 'build-menu-close';
    closeBtn.textContent = 'Отмена';
    closeBtn.onclick = closeBuildMenu;
    menu.appendChild(closeBtn);

    overlay.appendChild(menu);
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeBuildMenu();
    });
    document.body.appendChild(overlay);
}

function closeBuildMenu() {
    const overlay = document.querySelector('.build-menu-overlay');
    if (overlay) overlay.remove();
    buildMenuOpen = false;
}

// ======================== ЗДАНИЯ: ПОСТРОЙКА ========================
function buildAt(r, c, key) {
    if (board[r][c] !== null || buildings[r][c]) return;
    const b = BUILDINGS[key];
    if (money < b.cost) { log(`💰 Не хватает денег на ${b.name}!`); return; }

    money -= b.cost;
    buildings[r][c] = {
        type: key,
        state: 'constructing',
        startTime: Date.now(),
        duration: b.buildTime
    };
    updateMoneyDisplay();
    renderBoard();
    log(`🏗️ Начата стройка: ${b.name} (${b.cost} монет, ${(b.buildTime/1000).toFixed(1)} сек)`);

    const timer = setTimeout(() => {
        activeTimers.delete(timer);
        const bld = buildings[r][c];
        if (!bld || bld.state !== 'constructing') return;
        bld.state = 'idle';
        renderBoard();
        log(`✅ Построено: ${b.name}. ЛКМ — производство, ПКМ — снос.`);
    }, b.buildTime);
    activeTimers.add(timer);
}

// ======================== ЗДАНИЯ: ПРОИЗВОДСТВО ========================
function processBuilding(r, c, clickX, clickY) {
    const b = buildings[r][c];
    if (!b) return;

    if (b.state === 'constructing') {
        const remaining = Math.max(0, b.duration - (Date.now() - b.startTime));
        log(`🏗️ Стройка: ещё ${(remaining/1000).toFixed(1)} сек`);
        return;
    }
    if (b.state === 'demolishing') {
        const remaining = Math.max(0, b.demolishDuration - (Date.now() - b.demolishStart));
        log(`💥 Снос: ещё ${(remaining/1000).toFixed(1)} сек`);
        return;
    }
    if (b.state === 'working') {
        const remaining = Math.max(0, b.productionDuration - (Date.now() - b.productionStart));
        log(`⏳ Производство: готово через ${(remaining/1000).toFixed(1)} сек`);
        return;
    }

    const info = BUILDINGS[b.type];
    const inputRes = info.input;
    if (inventory[inputRes] <= 0) {
        log(`❌ Нет ${RESOURCES[inputRes].name} для переработки`);
        return;
    }

    inventory[inputRes]--;
    renderInventory();

    b.state = 'working';
    b.productionStart = Date.now();
    b.productionDuration = info.produceTime;
    renderBoard();
    log(`🏭 ${info.name}: ${RESOURCES[inputRes].name} → ${PRODUCTS[info.output].name} (${(info.produceTime/1000).toFixed(1)} сек)`);

    const timer = setTimeout(() => {
        activeTimers.delete(timer);
        const bld = buildings[r][c];
        if (!bld || bld.state !== 'working') return;
        bld.state = 'idle';
        const outputRes = info.output;
        addToInventory(outputRes, 1);
        renderInventory();
        renderBoard();
        log(`✅ Готово: ${PRODUCTS[outputRes].name}`);
        flyResourceToBarn(outputRes, r, c);
    }, info.produceTime);
    activeTimers.add(timer);
}

// ======================== ЗДАНИЯ: СНОС ========================
function startDemolish(r, c) {
    const b = buildings[r][c];
    if (!b) return;
    if (b.state === 'demolishing') {
        log(`💥 Снос уже идёт`);
        return;
    }

    const info = BUILDINGS[b.type];

    // Если здание в процессе стройки — отменяем стройку без возврата денег
    if (b.state === 'constructing') {
        // Отменяем активные таймеры для этой клетки
        // (они проверяют state, поэтому просто переведём в demolishing — они не сработают)
        b.state = 'demolishing';
        b.demolishStart = Date.now();
        b.demolishDuration = Math.floor(info.buildTime / 2);
        b.refund = 0; // за недостроенное не возвращаем
        renderBoard();
        log(`💥 Снос недостроенного здания. Возврат: 0 монет.`);

        const timer = setTimeout(() => {
            activeTimers.delete(timer);
            const bld = buildings[r][c];
            if (!bld || bld.state !== 'demolishing') return;
            buildings[r][c] = null;
            renderBoard();
            log(`💥 Снесено. Возврат: 0 монет.`);
        }, b.demolishDuration);
        activeTimers.add(timer);
        return;
    }

    // Если здание работает — отменяем производство (сырьё не возвращаем)
    // Если idle — просто снос с возвратом 50%
    const refund = Math.floor(info.cost * 0.5);
    b.state = 'demolishing';
    b.demolishStart = Date.now();
    b.demolishDuration = Math.floor(info.buildTime / 2);
    b.refund = refund;
    renderBoard();
    log(`💥 Начат снос: ${info.name}. Возврат: ${refund} монет (50%).`);

    const timer = setTimeout(() => {
        activeTimers.delete(timer);
        const bld = buildings[r][c];
        if (!bld || bld.state !== 'demolishing') return;
        money += bld.refund || 0;
        buildings[r][c] = null;
        updateMoneyDisplay();
        renderBoard();
        log(`💥 Снесено. Возврат: ${bld.refund || 0} монет.`);
    }, b.demolishDuration);
    activeTimers.add(timer);
}

// ======================== ХОД ========================
async function swapCells(r1, c1, r2, c2) {
    if (buildings[r1][c1] || buildings[r2][c2]) return;
    if (board[r1][c1] === null || board[r2][c2] === null) return;
    busy = true;
    [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
    renderBoard();
    await sleep(180);
    if (findAllMatches().length === 0) {
        [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
        renderBoard();
        log('🌾 Нет совпадений, попробуй ещё!');
        busy = false;
        return;
    }
    await processMatches();
    busy = false;
}

async function processMatches() {
    let matches = findAllMatches();
    let comboCount = 0;

    while (matches.length > 0) {
        comboCount++;

        const typeInfo = {};
        matches.forEach(([r, c]) => {
            const animal = board[r][c];
            if (!animal) return;
            if (!typeInfo[animal]) typeInfo[animal] = { count: 0, sumR: 0, sumC: 0 };
            typeInfo[animal].count++;
            typeInfo[animal].sumR += r;
            typeInfo[animal].sumC += c;
        });

        Object.keys(typeInfo).forEach(animalType => {
            const info = typeInfo[animalType];
            const resourceType = ANIMALS[animalType].resource;
            const resourceCount = Math.max(1, Math.floor(info.count / 3));
            addToInventory(resourceType, resourceCount);
            const avgR = Math.floor(info.sumR / info.count);
            const avgC = Math.floor(info.sumC / info.count);
            for (let i = 0; i < resourceCount; i++) {
                setTimeout(() => flyResourceToBarn(resourceType, avgR, avgC), i * 100);
            }
        });

        renderInventory();

        const clearingSet = new Set(matches.map(([r, c]) => `${r},${c}`));
        renderBoard({ clearing: clearingSet });
        await sleep(220);

        matches.forEach(([r, c]) => { board[r][c] = null; });

        const clearedSet = new Set(matches.map(([r, c]) => `${r},${c}`));

        const spawnSet = new Set();
        const dropSet = new Set();

        for (let c = 0; c < BOARD_SIZE; c++) {
            const survivors = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                if (buildings[r][c]) continue;
                if (board[r][c] === null && !clearedSet.has(`${r},${c}`)) continue;
                if (board[r][c] !== null) survivors.push({ animal: board[r][c], oldRow: r });
            }

            const workRows = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                if (buildings[r][c]) continue;
                if (board[r][c] === null && !clearedSet.has(`${r},${c}`)) continue;
                workRows.push(r);
            }

            for (let i = 0; i < workRows.length; i++) {
                const r = workRows[i];
                if (i < workRows.length - survivors.length) {
                    board[r][c] = ANIMAL_KEYS[Math.floor(Math.random() * ANIMAL_KEYS.length)];
                    spawnSet.add(`${r},${c}`);
                } else {
                    const s = survivors[i - (workRows.length - survivors.length)];
                    board[r][c] = s.animal;
                    if (s.oldRow !== r) dropSet.add(`${r},${c}`);
                }
            }
        }

        renderBoard({ spawn: spawnSet, drop: dropSet });
        await sleep(300);
        matches = findAllMatches();
    }

    if (comboCount > 0) {
        log(comboCount > 1 ? `✨ Комбо x${comboCount}! Урожай в амбаре!` : '🌾 Урожай собран! Ресурсы в амбаре!');
    }
}

function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

// ======================== ТОРГОВЛЯ ========================
function sellItem(type, isAnimalOrProduct) {
    if (inventory[type] <= 0) return;
    let price;
    if (isAnimalOrProduct === true) price = Math.floor(Math.random() * 21) + 20;
    else if (isAnimalOrProduct === false) price = RESOURCES[type].basePrice + Math.floor(Math.random() * 6) - 2;
    else price = PRODUCTS[type].basePrice + Math.floor(Math.random() * 8) - 2;
    if (price < 1) price = 1;
    money += price; inventory[type]--;
    updateMoneyDisplay(); renderInventory();
    const name = isAnimalOrProduct === true ? ANIMALS[type].name
                : isAnimalOrProduct === false ? RESOURCES[type].name : PRODUCTS[type].name;
    log(`💰 Продано: ${name} за ${price} монет`);
}

function tradeItem(type, isAnimalOrProduct) {
    if (inventory[type] <= 0) return;
    if (isAnimalOrProduct === true) {
        const resType = RESOURCE_KEYS[Math.floor(Math.random() * RESOURCE_KEYS.length)];
        const amount = Math.floor(Math.random() * 3) + 2;
        inventory[type]--;
        addToInventory(resType, amount);
        log(`🔄 Обмен: ${ANIMALS[type].name} → ${amount} ${RESOURCES[resType].name}`);
    } else if (isAnimalOrProduct === false) {
        if (Math.random() < 0.5) {
            const animalType = ANIMAL_KEYS[Math.floor(Math.random() * ANIMAL_KEYS.length)];
            inventory[type]--; addToInventory(animalType, 1);
            log(`🔄 Обмен: ${RESOURCES[type].name} → ${ANIMALS[animalType].name}`);
        } else {
            const others = RESOURCE_KEYS.filter(k => k !== type);
            const target = others[Math.floor(Math.random() * others.length)];
            const amount = Math.floor(Math.random() * 3) + 1;
            inventory[type]--; addToInventory(target, amount);
            log(`🔄 Обмен: ${RESOURCES[type].name} → ${amount} ${RESOURCES[target].name}`);
        }
    } else {
        const moneyGain = Math.floor(PRODUCTS[type].basePrice / 2);
        inventory[type]--; money += moneyGain; updateMoneyDisplay();
        log(`🔄 Обмен: ${PRODUCTS[type].name} → ${moneyGain} монет`);
    }
    renderInventory();
}

// ======================== СТАРТ ========================
function detectLowEnd() {
    const cores = navigator.hardwareConcurrency || 4;
    const mem = navigator.deviceMemory || 4;
    if (cores <= 2 || mem <= 2) document.body.classList.add('low-end');
}
// ======================== МУЗЫКА ========================
const bgMusic = document.getElementById('bgMusic');
const soundToggle = document.getElementById('soundToggle');
let musicEnabled = true;

// Громкость (0.0 – 1.0)
bgMusic.volume = 0.45;

function updateSoundButton() {
    soundToggle.textContent = musicEnabled ? '🔊' : '🔇';
    soundToggle.classList.toggle('muted', !musicEnabled);
}

function playMusic() {
    if (!musicEnabled) return;
    const p = bgMusic.play();
    if (p && p.catch) {
        // Браузер заблокировал автозапуск — ждём первого действия пользователя
        p.catch(() => {});
    }
}

// Запуск после первого взаимодействия (требование браузеров)
function unlockAudio() {
    playMusic();
    window.removeEventListener('pointerdown', unlockAudio);
    window.removeEventListener('touchstart', unlockAudio);
    window.removeEventListener('keydown', unlockAudio);
}
window.addEventListener('pointerdown', unlockAudio, { once: true });
window.addEventListener('touchstart', unlockAudio, { once: true });
window.addEventListener('keydown', unlockAudio, { once: true });

// Кнопка вкл/выкл
soundToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    musicEnabled = !musicEnabled;
    if (musicEnabled) {
        playMusic();
    } else {
        bgMusic.pause();
    }
    updateSoundButton();
});

// Пауза музыки, когда вкладка неактивна (по желанию)
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        bgMusic.pause();
    } else if (musicEnabled) {
        playMusic();
    }
});

updateSoundButton();
function initGame() {
    detectLowEnd();
    level = 0;
    levelCollected = {};
    goalCompleted = false;
    money = 100;
    resetInventory();
    activeTimers.forEach(t => clearTimeout(t));
    activeTimers.clear();
    initBoardForLevel();
    renderBoard();
    renderInventory();
    updateMoneyDisplay();
    renderGoals();
    log('🌱 Свайпай животных — собери 3+ в ряд!');
    bindControls();
    window.addEventListener('resize', () => renderBoard());
    setInterval(updateProgressBars, 100);
}

initGame();
